services:
  - type: web
    name: multiverse-qbtz
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://multiverse-2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
